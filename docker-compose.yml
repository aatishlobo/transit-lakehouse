# Local single-broker Kafka for the reviewable demo path.
#
# KRaft mode (no ZooKeeper). Kafka 3.3+ manages its own cluster metadata via a
# built-in Raft quorum, so the old two-container ZooKeeper+broker setup is
# obsolete. One container, one process, far less to explain and to break.
#
# This is deliberately NOT a production topology: one broker, replication
# factor 1. A real deployment needs >= 3 brokers so a broker loss doesn't lose
# data. That tradeoff is fine here precisely because Kafka is NOT the system of
# record in this project -- the disk archive under data/raw/ is. Kafka is
# transport (pitfall 3.3).

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: transit-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # TWO listeners, and the reason is the single most common Kafka-in-Docker
      # failure. A client does not keep using the address it dialed: it asks
      # the broker for metadata, and the broker answers with its ADVERTISED
      # address, which the client then reconnects to. So one advertised
      # address cannot serve both audiences --
      #   * another container reaches the broker as `kafka`
      #   * a process on the Mac reaches it as `localhost`
      # Advertise only `localhost` and containers dial themselves and hang.
      # Advertise only `kafka` and host processes fail to resolve the name.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single broker: every internal topic must also be RF=1 or the broker
      # refuses to create them and startup hangs with a confusing error.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Default is 3000ms, which makes every consumer start feel broken during
      # a demo. Zero is safe with one consumer group member.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Auto-creation OFF. A typo'd topic name would otherwise silently create
      # a brand-new empty topic and the consumer would sit there reading
      # nothing, which is a miserable thing to debug. Topics are created
      # explicitly by kafka-init below.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      # Ask the broker to list topics. Succeeds only once it is genuinely
      # serving requests -- a TCP port check would pass too early.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Creates topics with explicit settings, then exits. Runs on every `up`;
  # --if-not-exists makes it idempotent.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: transit-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        TOPICS="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092"

        # PARTITIONS = 3.
        #   Partition count is effectively immutable (pitfall 3.4): increasing
        #   it later changes which partition a key hashes to, so a key's
        #   history splits across partitions and per-key ordering breaks
        #   retroactively. Chosen now, deliberately, rather than defaulted.
        #   3 is enough to demonstrate real keyed partitioning while staying
        #   comprehensible on one broker.
        #
        # cleanup.policy=delete, NOT compact.
        #   Compaction keeps only the LATEST value per key and discards the
        #   rest. These topics are an event log -- every observation of a trip
        #   over time IS the data. Compacting them would destroy exactly the
        #   history the arrival resolver reads (pitfall 3.6).
        #
        # retention.ms = 24h.
        #   Short ON PURPOSE. Kafka is not the archive; data/raw/ is. A long
        #   retention here would invite treating the topic as durable storage,
        #   which is pitfall 3.3. Replay comes from disk, not from Kafka.
        for t in gtfsrt.trip_updates.v1 gtfsrt.vehicle_positions.v1; do
          $$TOPICS --create --if-not-exists --topic $$t \
            --partitions 3 --replication-factor 1 \
            --config cleanup.policy=delete \
            --config retention.ms=86400000
        done

        # Dead letter: records that fail contract validation. One partition --
        # ordering across bad records doesn't matter, and volume should be
        # near zero. Longer retention (7d) because these need human inspection
        # and must outlive the run that produced them.
        $$TOPICS --create --if-not-exists --topic gtfsrt.dead_letter.v1 \
          --partitions 1 --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000

        # Output: resolved arrival events with provenance.
        $$TOPICS --create --if-not-exists --topic transit.arrival_events.v1 \
          --partitions 3 --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=604800000

        echo "--- topics ready ---"
        $$TOPICS --list
