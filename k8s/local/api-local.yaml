# Local (minikube) variant of the serving tier.
#
# Differs from k8s/api.yaml in ONE respect: the exported marts are baked into
# the image instead of mounted from a ReadWriteMany PVC, because minikube's
# default storage class provides ReadWriteOnce only. Everything else --
# replicas, probes, resource envelope -- matches production, so this exercises
# the real manifest shape rather than a toy.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: transit}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: transit-lakehouse/api:latest
          imagePullPolicy: Never          # built into minikube's daemon
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 250m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: transit}
spec:
  type: NodePort
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000, nodePort: 30080}]
