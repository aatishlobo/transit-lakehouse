# Strimzi Kafka. Three brokers, RF=3, min.insync.replicas=2.
#
# The local dev setup runs one broker at RF=1 and that is fine there, because
# Kafka is transport and the archive is the system of record -- losing the log
# costs a replay, not data. In a shared cluster the calculus changes: other
# teams read these topics, so unavailability is the cost, not data loss.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata: {name: transit, namespace: transit}
spec:
  kafka:
    version: 3.8.0
    replicas: 3
    listeners:
      - {name: plain, port: 9092, type: internal, tls: false}
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    storage: {type: persistent-claim, size: 100Gi, deleteClaim: false}
  entityOperator:
    topicOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: gtfsrt.vehicle-positions.v1
  namespace: transit
  labels: {strimzi.io/cluster: transit}
spec:
  partitions: 3
  replicas: 3
  config:
    # NEVER compact. Compaction keeps only the latest message per key, and the
    # arrival resolver works by reading STOPPED_AT state transitions across
    # consecutive observations -- compaction would delete exactly the signal it
    # consumes, and would look like an optimisation while doing it.
    cleanup.policy: delete
    retention.ms: "86400000"      # 24h. Short on purpose: it must be
                                  # impossible to drift into treating the topic
                                  # as a database.
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: gtfsrt.trip-updates.v1
  namespace: transit
  labels: {strimzi.io/cluster: transit}
spec:
  partitions: 3
  replicas: 3
  config: {cleanup.policy: delete, retention.ms: "86400000", min.insync.replicas: "2"}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: gtfsrt.dead-letter.v1
  namespace: transit
  labels: {strimzi.io/cluster: transit}
spec:
  # One partition: ordering across the whole DLQ is more useful than
  # parallelism, and the volume is meant to be ~zero.
  partitions: 1
  replicas: 3
  config: {cleanup.policy: delete, retention.ms: "604800000"}
