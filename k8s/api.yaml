# Always-on serving tier. Small and cheap by design: it reads an exported
# SQLite artifact, so it needs no Spark, no JVM and no Kafka. This is what
# keeps the public demo clickable while the heavy infrastructure is scaled to
# zero.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: transit}
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: transit-lakehouse/api:latest
          args: ["-m", "uvicorn", "serving.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 250m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          volumeMounts:
            - {name: marts, mountPath: /app/serving/data, readOnly: true}
      volumes:
        - name: marts
          persistentVolumeClaim: {claimName: marts-pvc}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: transit}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: marts-pvc, namespace: transit}
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 1Gi}}
