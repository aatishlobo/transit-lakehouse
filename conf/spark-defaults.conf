# Consumed by dbt-spark's session method, which builds its own SparkSession and
# therefore does not inherit spark/session.py. These must mirror that file or a
# dbt model can behave differently from the identical query in a Spark job.
spark.sql.extensions               io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog    org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.jars                         /Users/aatishlobo/.ivy2.5.2/jars/io.delta_delta-spark_2.13-4.0.0.jar,/Users/aatishlobo/.ivy2.5.2/jars/io.delta_delta-storage-4.0.0.jar,/Users/aatishlobo/.ivy2.5.2/jars/org.antlr_antlr4-runtime-4.13.1.jar
spark.sql.session.timeZone         UTC
spark.sql.shuffle.partitions       16
spark.driver.memory                4g
spark.sql.adaptive.enabled         true

# Same metastore as spark/session.py. Without these, dbt (run from dbt/) builds
# its own catalog and cannot see tables registered from repo root.
spark.sql.catalogImplementation    hive
spark.sql.warehouse.dir            /Users/aatishlobo/Desktop/transit-lakehouse/spark-warehouse
javax.jdo.option.ConnectionURL     jdbc:derby:;databaseName=/Users/aatishlobo/Desktop/transit-lakehouse/metastore_db;create=true
